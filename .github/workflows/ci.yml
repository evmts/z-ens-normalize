name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Zig ${{ matrix.zig }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
        zig: ['0.15.1', '0.15.2', '0.16.0', '0.17.1']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ matrix.zig }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # Zig 0.15 cannot link its build runner with the newer macOS SDK.
      - name: Select the macOS 15 SDK
        if: matrix.os == 'macos-15'
        run: echo "DEVELOPER_DIR=/Applications/Xcode_16.4.app/Contents/Developer" >> "$GITHUB_ENV"
      - name: Check formatting
        if: matrix.zig == '0.15.1'
        run: zig fmt --check build.zig build.zig.zon src tests
      - name: Build Zig, C, WASM and WASI artifacts
        run: zig build install c-lib wasm-all copy-test-data
      - name: Run unit and conformance tests
        run: zig build test --summary all
      - name: Run generated ENS input properties
        run: zig build fuzz --summary all
      - name: Run C ABI and WASM integration tests
        run: zig build e2e --summary all
      - name: Run the normalization benchmark
        run: zig build bench --summary all
